[project]
name = "function-tagger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Trent_lee", email = "trenttlee@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
function-tagger = "function_tagger.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[dependency-groups]
